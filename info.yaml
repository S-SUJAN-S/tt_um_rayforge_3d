# Tiny Tapeout project information
project:
  title:        "RayForge-X: 3D Sphere Tracing & Raymarching Engine"
  author:       "Sujan S, Tejasvi R Shankar, Yogesh Mahesh Bisnal, Prathik P Kekare"
  discord:      ""
  description:  "Real-time 640x480 @ 60Hz 3D raymarching ASIC processor in SkyWater 130nm"
  language:     "Verilog"
  clock_hz:     25175000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_".
  top_module:  "tt_um_rayforge_3d"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  source_files:
    - "tt_um_rayforge_3d.v"
    - "vga_timing_gen.v"
    - "perspective_ground.v"
    - "sphere_tracer_pipeline.v"
    - "sdf_engine.v"
    - "phong_shading.v"
    - "bist_diagnostic.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "anim_en"
  ui[1]: "geom_sel"
  ui[2]: ""
  ui[3]: "shading_mode[0]"
  ui[4]: "shading_mode[1]"
  ui[5]: "light_angle[0]"
  ui[6]: "light_angle[1]"
  ui[7]: "bist_en"

  # Outputs (Tiny VGA PMOD)
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "vsync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "hsync"

  # Bidirectional pins (7-Segment & BIST)
  uio[0]: "seg_a"
  uio[1]: "seg_b"
  uio[2]: "seg_c"
  uio[3]: "seg_d"
  uio[4]: "seg_e"
  uio[5]: "seg_f"
  uio[6]: "seg_g"
  uio[7]: "bist_pass_led"

# Do not change!
yaml_version: 6
