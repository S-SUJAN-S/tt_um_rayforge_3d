<title>RayForge-X VGA demo</title>
<style>
:root { color-scheme: dark; --font-size-base: 1rem; font-family: system-ui, sans-serif; }
body { max-width: 45rem; margin: 2rem auto; padding: 0 1rem; background: #151a23; color: #f4f6ff; }
a { color: #b5d0ff; }
.viz-controls { display: flex; flex-wrap: wrap; gap: .75rem 1rem; }
.form-label { display: grid; gap: .25rem; }
.form-select, .btn { font: inherit; padding: .35em .5em; }
.text-muted { color: #bdc7d8; }
canvas { border: 1px solid #3c485b; }
</style>
<main>
<h1>RayForge-X VGA demo</h1>
<p>Inspect 640 × 480 VGA frames from the programmable RTL. Select Disk or Capsule to try all 16 sizes and see the corresponding switch word.</p>
<section id="rayforge-demo">
  <style>
    #rayforge-demo [hidden] { display: none !important; }
  </style>
  <div class="viz-controls">
    <label class="form-label"><span id="rayforge-view-label">View</span>
      <select class="form-select" aria-labelledby="rayforge-view-label" data-view>
        <optgroup label="Original scenes">
          <option value="face">Face-on torus</option>
          <option value="edge">Edge-on torus</option>
          <option value="cube">Projected cube</option>
          <option value="normal">Torus normals</option>
          <option value="depth">Torus depth proxy</option>
        </optgroup>
        <optgroup label="Programmable geometry">
          <option value="disk">Disk</option>
          <option value="capsule">Capsule</option>
        </optgroup>
        <optgroup label="Exact silhouettes">
          <option value="face-mask">Face-on torus silhouette</option>
          <option value="edge-mask">Edge-on torus silhouette</option>
          <option value="cube-mask">Cube silhouette</option>
        </optgroup>
      </select>
    </label>
    <label class="form-label" data-angle-label hidden><span id="rayforge-angle-label">Light angle</span>
      <select class="form-select" aria-labelledby="rayforge-angle-label" data-angle></select>
    </label>
    <label class="form-label" data-radius-label hidden><span id="rayforge-radius-label">Radius</span>
      <select class="form-select" aria-labelledby="rayforge-radius-label" data-radius></select>
    </label>
  </div>
  <div class="viz-row" style="margin:0.65em 0">
    <button class="btn btn-primary" type="button" data-play hidden>Play light orbit</button>
    <label class="form-check">
      <input class="form-check-input" type="checkbox" data-zoom>
      <span class="form-check-label">Zoom to object</span>
    </label>
  </div>

  <script>
  (() => {
    const root = document.getElementById('rayforge-demo');
    const find = (name) => root.querySelector('[data-' + name + ']');
    const select = find('view'), angle = find('angle'), zoom = find('zoom'), play = find('play');
    const canvas = find('raster'), status = find('status'), angleLabel = find('angle-label');
    const radius = find('radius'), radiusLabel = find('radius-label');
    const data = JSON.parse(find('data').textContent);
    const frame = document.createElement('canvas');
    frame.width = 640;
    frame.height = 480;
    const source = frame.getContext('2d');
    const screen = canvas.getContext('2d');
    const cache = new Map();
    let renderEpoch = 0, timer = 0;

    if (data.orbit.length) {
      angle.add(new Option('Default capture', '-1'));
      data.orbit.forEach((_, i) => angle.add(new Option('Angle ' + (i + 1), String(i))));
    }
    for (let code = 0; code < 16; code++) {
      const value = Math.sqrt(256 + 128 * code).toFixed(2);
      radius.add(new Option(value + ' px', String(code)));
    }

    async function unpack(encoded) {
      if (cache.has(encoded)) return cache.get(encoded);
      const packed = Uint8Array.from(atob(encoded), (char) => char.charCodeAt(0));
      const stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream('deflate'));
      const values = new Uint8Array(await new Response(stream).arrayBuffer());
      if (values.length !== 640 * 480) throw new Error('Unexpected raster length');
      const pixels = source.createImageData(640, 480);
      for (let i = 0; i < values.length; i++) {
        const sample = values[i], p = 4 * i;
        pixels.data[p] = 85 * (sample >> 4);
        pixels.data[p + 1] = 85 * ((sample >> 2) & 3);
        pixels.data[p + 2] = 85 * (sample & 3);
        pixels.data[p + 3] = 255;
      }
      cache.set(encoded, pixels);
      return pixels;
    }

    async function draw() {
      const epoch = ++renderEpoch;
      const profileView = select.value === 'disk' || select.value === 'capsule';
      const showOrbit = select.value === 'face' && data.orbit.length > 0;
      play.hidden = angleLabel.hidden = !showOrbit;
      radiusLabel.hidden = !profileView;
      const index = showOrbit ? Number(angle.value) : -1;
      const profileIndex = Number(radius.value) + (select.value === 'capsule' ? 16 : 0);
      const item = profileView ? data.profiles[profileIndex] : data.views[select.value];
      const pixels = await unpack(index < 0 ? item.pixels : data.orbit[index]);
      if (epoch !== renderEpoch) return;
      source.putImageData(pixels, 0, 0);
      screen.imageSmoothingEnabled = false;
      if (zoom.checked) screen.drawImage(frame, 160, 68, 320, 240, 0, 0, 640, 480);
      else screen.drawImage(frame, 0, 0);
      canvas.setAttribute('aria-label', item.label + ' VGA output' +
        (item.input ? ', input ' + item.input : ''));
      if (!timer) status.textContent = index < 0
        ? [item.input && 'Input ' + item.input, item.source, zoom.checked ? '2× crop' : '640 × 480']
            .filter(Boolean).join(' · ')
        : '640 × 480 · RTL light orbit';
    }

    function update() {
      draw().catch(() => { status.textContent = 'Could not decode the capture.'; });
    }
    function stop() {
      clearTimeout(timer);
      timer = 0;
      play.textContent = 'Play light orbit';
    }
    function save() {
      window.openai?.setWidgetState?.({
        modelContent: {scene: select.value, radiusCode: Number(radius.value)},
        privateContent: {zoom: zoom.checked},
      })?.catch(() => {});
    }
    function restore(state) {
      const view = state?.modelContent?.scene;
      if (view === 'disk' || view === 'capsule' || Object.hasOwn(data.views, view)) select.value = view;
      const code = state?.modelContent?.radiusCode;
      radius.value = Number.isInteger(code) && code >= 0 && code < 16 ? String(code) : '0';
      zoom.checked = state?.privateContent?.zoom === true;
      update();
    }
    select.addEventListener('change', () => { stop(); angle.value = '-1'; update(); save(); });
    angle.addEventListener('change', () => { stop(); update(); });
    radius.addEventListener('change', () => { update(); save(); });
    zoom.addEventListener('change', () => { update(); save(); });
    play.addEventListener('click', () => {
      if (timer) { stop(); update(); return; }
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        angle.value = String((Number(angle.value) + 1) % data.orbit.length);
        update();
        return;
      }
      play.textContent = 'Stop';
      status.textContent = '640 × 480 · RTL light orbit · slowed playback';
      let index = 0;
      function next() {
        if (index === data.orbit.length) { stop(); update(); return; }
        angle.value = String(index++);
        timer = setTimeout(next, 230);
        update();
      }
      next();
    });
    window.addEventListener('openai:set_globals', (event) => {
      const state = event.detail?.globals?.widgetState;
      if (state) restore(state);
    });
    restore(window.openai?.widgetState);
  })();
  </script>
